[project]
name = "sana-challenge-backend"
version = "0.1.0"
description = "SanaChallenge AI backend"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.38,<2.1", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
  "openai>=2,<3", "httpx>=0.28,<1", "argon2-cffi>=23,<26",
  "email-validator>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a dedicated PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
