name: sana-challenge
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sana_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-sana}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sana}:${POSTGRES_PASSWORD:-sana_local_only}@postgres:5432/${POSTGRES_DB:-sana}
      APP_ENV: ${APP_ENV:-development}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-false}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-25}
    depends_on:
      postgres:
        condition: service_healthy
  review-demo:
    build: ./backend
    command: ["python", "-m", "scripts.seed_review_demo"]
    environment:
      <<: *backend-env
      REVIEW_DEMO_ENABLED: ${REVIEW_DEMO_ENABLED:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
  backend:
    build: ./backend
    environment: *backend-env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      review-demo:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  postgres_data:
